<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1240" height="960" fill="#ffffff"/>
  <text x="620" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#1a2233">Perch&#233; serve la ReLU &#8212; il mondo non &#232; una retta</text>

  <!-- ============ ROW 1 LEFT: wild mappings ============ -->
  <rect x="60" y="80" width="545" height="220" rx="12" fill="#f5f7fa" stroke="#d0d7e2" stroke-width="1.5"/>
  <text x="84" y="112" font-size="18" font-weight="bold" fill="#1a2233">Le mappature interessanti sono selvaggiamente non lineari</text>

  <!-- pixel grid icon -->
  <g transform="translate(96,136)">
    <rect x="0" y="0" width="66" height="66" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="0"  y="0"  width="22" height="22" fill="#94a3b8"/>
    <rect x="22" y="22" width="22" height="22" fill="#64748b"/>
    <rect x="44" y="0"  width="22" height="22" fill="#cbd5e1"/>
    <rect x="0"  y="44" width="22" height="22" fill="#cbd5e1"/>
    <rect x="44" y="44" width="22" height="22" fill="#94a3b8"/>
    <rect x="22" y="0"  width="22" height="22" fill="#e2e8f0"/>
  </g>
  <text x="129" y="222" text-anchor="middle" font-size="12.5" fill="#64748b">1M di pixel</text>
  <line x1="180" y1="169" x2="250" y2="169" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
  <rect x="258" y="146" width="130" height="46" rx="23" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="323" y="174" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#047857">&#232; un gatto?</text>

  <text x="96" y="246" font-size="14.5" fill="#475569">&#8220;il gatto &#232; sul &#8230;&#8221;</text>
  <line x1="230" y1="241" x2="290" y2="241" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
  <rect x="298" y="222" width="110" height="34" rx="17" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="353" y="245" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#047857">&#8220;tetto&#8221;</text>
  <text x="96" y="284" font-size="13" fill="#64748b" font-style="italic">nessuna formula &#8220;dritta&#8221; collega pixel a concetti o parole a parole</text>

  <!-- ============ ROW 1 RIGHT: line can't fit curve ============ -->
  <rect x="635" y="80" width="545" height="220" rx="12" fill="#f5f7fa" stroke="#d0d7e2" stroke-width="1.5"/>
  <text x="659" y="112" font-size="18" font-weight="bold" fill="#1a2233">Una retta non pu&#242; abbracciare una curva</text>
  <g transform="translate(680,130)">
    <line x1="0" y1="140" x2="460" y2="140" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#cbd5e1" stroke-width="1"/>
    <!-- true curve (data) -->
    <path d="M 0 120 C 60 60, 100 38, 160 42 C 220 46, 240 85, 300 102 C 350 116, 400 70, 450 22"
          fill="none" stroke="#0ea5e9" stroke-width="3.5"/>
    <circle cx="20" cy="103" r="4" fill="#0284c7"/><circle cx="90" cy="48" r="4" fill="#0284c7"/>
    <circle cx="160" cy="42" r="4" fill="#0284c7"/><circle cx="230" cy="62" r="4" fill="#0284c7"/>
    <circle cx="300" cy="102" r="4" fill="#0284c7"/><circle cx="380" cy="88" r="4" fill="#0284c7"/>
    <circle cx="445" cy="27" r="4" fill="#0284c7"/>
    <!-- best straight line -->
    <line x1="0" y1="100" x2="455" y2="52" stroke="#f43f5e" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="330" y="20" font-size="13.5" fill="#0284c7">dati veri (curva)</text>
    <text x="30" y="82" font-size="13.5" fill="#e11d48">miglior retta possibile: sbaglia sempre</text>
  </g>

  <!-- ============ ROW 2: the collapse algebra ============ -->
  <rect x="60" y="330" width="1120" height="270" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="84" y="364" font-size="19" font-weight="bold" fill="#991b1b">SENZA ReLU: due strati lineari collassano in uno &#8212; &#232; algebra</text>

  <!-- pipeline W1 W2 merging -->
  <g transform="translate(120,395)">
    <text x="0" y="34" font-size="17" font-family="Menlo, Consolas, monospace" fill="#334155">x</text>
    <line x1="18" y1="28" x2="58" y2="28" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
    <rect x="64" y="4" width="110" height="48" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
    <text x="119" y="34" text-anchor="middle" font-size="16.5" font-family="Menlo, Consolas, monospace" fill="#b91c1c">W&#8321; &#183; x</text>
    <line x1="180" y1="28" x2="220" y2="28" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
    <rect x="226" y="4" width="130" height="48" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
    <text x="291" y="34" text-anchor="middle" font-size="16.5" font-family="Menlo, Consolas, monospace" fill="#b91c1c">W&#8322; &#183; ( &#183; )</text>
    <text x="405" y="34" font-size="22" fill="#991b1b">=</text>
    <line x1="440" y1="28" x2="480" y2="28" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
    <rect x="486" y="4" width="200" height="48" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
    <text x="586" y="34" text-anchor="middle" font-size="16.5" font-family="Menlo, Consolas, monospace" fill="#991b1b">(W&#8322;&#183;W&#8321;) &#183; x  =  W&#183;x</text>
    <text x="760" y="34" font-size="15" fill="#b91c1c">&#8592; UN solo strato!</text>
  </g>

  <rect x="120" y="480" width="1000" height="50" rx="8" fill="#ffe4e6" stroke="#fda4af"/>
  <text x="620" y="511" text-anchor="middle" font-size="16.5" font-family="Menlo, Consolas, monospace" fill="#9f1239">matmul( matmul(x) )  =  matmul(x)&#160;&#160;&#8594;&#160;&#160;retta di retta = retta, a qualsiasi profondit&#224;</text>
  <text x="620" y="560" text-anchor="middle" font-size="14" fill="#9f1239" font-style="italic">100 strati Linear impilati senza ReLU = la stessa retta rossa tratteggiata del pannello sopra. Profondit&#224; sprecata.</text>

  <!-- ============ ROW 3: with ReLU ============ -->
  <rect x="60" y="630" width="1120" height="300" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="84" y="664" font-size="19" font-weight="bold" fill="#166534">CON ReLU in mezzo: niente collasso &#8212; nascono le pieghe</text>

  <!-- pipeline with ReLU -->
  <g transform="translate(100,690)">
    <text x="0" y="34" font-size="17" font-family="Menlo, Consolas, monospace" fill="#334155">x</text>
    <line x1="18" y1="28" x2="50" y2="28" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
    <rect x="56" y="4" width="100" height="48" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
    <text x="106" y="34" text-anchor="middle" font-size="16" font-family="Menlo, Consolas, monospace" fill="#15803d">W&#8321;&#183;x</text>
    <line x1="162" y1="28" x2="194" y2="28" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
    <!-- ReLU box with hockey stick -->
    <rect x="200" y="-6" width="96" height="68" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/>
    <polyline points="212,44 248,44 284,8" fill="none" stroke="#15803d" stroke-width="3.5"/>
    <text x="248" y="76" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#15803d">ReLU</text>
    <line x1="302" y1="28" x2="334" y2="28" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
    <rect x="340" y="4" width="100" height="48" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
    <text x="390" y="34" text-anchor="middle" font-size="16" font-family="Menlo, Consolas, monospace" fill="#15803d">W&#8322;&#183;( )</text>
    <line x1="446" y1="28" x2="478" y2="28" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
    <text x="490" y="34" font-size="17" font-family="Menlo, Consolas, monospace" fill="#334155">&#375;</text>
  </g>
  <text x="100" y="800" font-size="15.5" font-family="Menlo, Consolas, monospace" fill="#166534">W&#8322;&#183;ReLU(W&#8321;&#183;x) &#8800; W&#183;x</text>
  <text x="100" y="824" font-size="13.5" fill="#15803d">la piega spezza l&#8217;algebra del collasso:</text>
  <text x="100" y="843" font-size="13.5" fill="#15803d">ogni neurone piazza un gomito,</text>
  <text x="100" y="862" font-size="13.5" fill="#15803d">la profondit&#224; ora AGGIUNGE forma</text>

  <!-- piecewise plot hugging curve -->
  <g transform="translate(680,690)">
    <line x1="0" y1="190" x2="460" y2="190" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="10" x2="0" y2="190" stroke="#cbd5e1" stroke-width="1"/>
    <!-- true curve again -->
    <path d="M 0 170 C 60 110, 100 88, 160 92 C 220 96, 240 135, 300 152 C 350 166, 400 120, 450 72"
          fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.55"/>
    <!-- piecewise approximation with kinks -->
    <polyline points="0,172 80,100 160,92 240,122 300,152 370,142 450,74"
              fill="none" stroke="#16a34a" stroke-width="3.5"/>
    <g fill="#15803d">
      <circle cx="80" cy="100" r="5"/><circle cx="160" cy="92" r="5"/>
      <circle cx="240" cy="122" r="5"/><circle cx="300" cy="152" r="5"/>
      <circle cx="370" cy="142" r="5"/>
    </g>
    <text x="240" y="34" font-size="13.5" fill="#16a34a" font-weight="bold">segmenti + pieghe &#8776; la curva</text>
    <text x="240" y="52" font-size="12.5" fill="#64748b">&#9679; = una piega = un neurone ReLU</text>
    <text x="250" y="215" font-size="13" fill="#166534" font-style="italic">milioni di pieghe &#8594; qualsiasi forma, in migliaia di dimensioni</text>
  </g>
</svg>
